services:
  db:
    image: postgres:18-alpine
    container_name: pharmacy-db
    environment:
      POSTGRES_USER: ${DB_USER:-pharmacy}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me}
      POSTGRES_DB: ${DB_NAME:-pharmacy_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pharmacy-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-pharmacy} -d ${DB_NAME:-pharmacy_db}"]
      interval: 5s
      timeout: 3s
      retries: 5

  migration:
    image: migrate/migrate:v4.18.2
    container_name: pharmacy-migration
    volumes:
      - ./db/migrations:/migrations
    command:
      - -path=/migrations
      - -database=postgres://${DB_USER:-pharmacy}:${DB_PASSWORD:-change-me}@db:5432/${DB_NAME:-pharmacy_db}?sslmode=disable
      - up
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build: .
    container_name: pharmacy-service
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-pharmacy}
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
      DB_NAME: ${DB_NAME:-pharmacy_db}
      DB_MAX_CONNS: ${DB_MAX_CONNS:-25}
      DB_MIN_CONNS: ${DB_MIN_CONNS:-5}
      GRPC_PORT: ${GRPC_PORT:-50059}
      METRICS_PORT: ${METRICS_PORT:-9100}
    ports:
      - "${GRPC_PORT:-50059}:${GRPC_PORT:-50059}"
      - "${METRICS_PORT:-9100}:${METRICS_PORT:-9100}"

volumes:
  pharmacy-db-data:
