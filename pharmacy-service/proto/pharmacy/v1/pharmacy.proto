syntax = "proto3";

package pharmacy.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/azuvicenna/selaras-services/pharmacy-service/gen/pharmacy/v1;pharmacyv1";

// =============================================================================
// ENUMS
// =============================================================================

enum MedicationForm {
  MEDICATION_FORM_UNSPECIFIED = 0;
  MEDICATION_FORM_TABLET = 1;
  MEDICATION_FORM_CAPSULE = 2;
  MEDICATION_FORM_SYRUP = 3;
  MEDICATION_FORM_INJECTION = 4;
  MEDICATION_FORM_OINTMENT = 5;
  MEDICATION_FORM_INFUSION = 6;
  MEDICATION_FORM_DROPS = 7;
  MEDICATION_FORM_INHALER = 8;
  MEDICATION_FORM_SUPPOSITORY = 9;
  MEDICATION_FORM_OTHER = 10;
}

enum StockMovementType {
  STOCK_MOVEMENT_TYPE_UNSPECIFIED = 0;
  STOCK_MOVEMENT_TYPE_IN = 1;
  STOCK_MOVEMENT_TYPE_OUT = 2;
  STOCK_MOVEMENT_TYPE_ADJUSTMENT = 3;
  STOCK_MOVEMENT_TYPE_DISPENSE = 4;
}

enum DispenseStatus {
  DISPENSE_STATUS_UNSPECIFIED = 0;
  DISPENSE_STATUS_RECEIVED = 1;
  DISPENSE_STATUS_PREPARING = 2;
  DISPENSE_STATUS_READY = 3;
  DISPENSE_STATUS_COMPLETED = 4;
  DISPENSE_STATUS_CANCELLED = 5;
}

// =============================================================================
// DOMAIN MODELS
// =============================================================================

message Medication {
  string id = 1;
  string kfa_code = 2;
  string name = 3;
  MedicationForm form = 4;
  string strength = 5;
  string unit = 6;
  string package_unit = 7;
  int32 conversion_factor = 8;
  double selling_price = 9;
  double purchase_price = 10;
  int32 min_stock = 11;
  bool is_active = 12;
  google.protobuf.Timestamp created_at = 13;
  google.protobuf.Timestamp updated_at = 14;
}

message Stock {
  string id = 1;
  string medication_id = 2;
  string batch_number = 3;
  string expiry_date = 4; // YYYY-MM-DD
  int32 current_quantity = 5;
  string location = 6; // e.g. "Gudang Utama", "Depo Rawat Jalan", "Depo IGD"
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

message StockMovement {
  string id = 1;
  string medication_id = 2;
  string batch_number = 3;
  StockMovementType movement_type = 4;
  int32 quantity = 5;
  string reference_type = 6; // e.g. "DISPENSE", "PURCHASE", "ADJUSTMENT"
  string reference_id = 7;
  string notes = 8;
  google.protobuf.Timestamp created_at = 9;
}

message DispenseItem {
  string id = 1;
  string dispense_id = 2;
  string medication_id = 3;
  string medication_name = 4;
  string batch_number = 5;
  int32 quantity = 6;
  double unit_price = 7;
  double subtotal = 8;
  string dosage_instruction = 9; // e.g. "3x1 tablet sesudah makan"
  string notes = 10;
}

message MedicationDispense {
  string id = 1;
  string dispense_number = 2;
  string prescription_id = 3;
  string encounter_id = 4;
  string patient_id = 5;
  string patient_name = 6;
  string pharmacist_id = 7;
  DispenseStatus status = 8;
  double total_amount = 9;
  string notes = 10;
  repeated DispenseItem items = 11;
  google.protobuf.Timestamp dispensed_at = 12;
  google.protobuf.Timestamp created_at = 13;
  google.protobuf.Timestamp updated_at = 14;
}
