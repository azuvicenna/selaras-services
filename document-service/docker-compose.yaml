services:
  db:
    image: postgres:18-alpine
    container_name: document-db
    environment:
      POSTGRES_USER: ${DB_USER:-document}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me}
      POSTGRES_DB: ${DB_NAME:-document_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - document-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-document} -d ${DB_NAME:-document_db}"]
      interval: 5s
      timeout: 3s
      retries: 5

  migration:
    image: migrate/migrate:v4.18.2
    container_name: document-migration
    volumes:
      - ./db/migrations:/migrations
    command:
      - -path=/migrations
      - -database=postgres://${DB_USER:-document}:${DB_PASSWORD:-change-me}@db:5432/${DB_NAME:-document_db}?sslmode=disable
      - up
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build: .
    container_name: document-service
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-document}
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
      DB_NAME: ${DB_NAME:-document_db}
      DB_MAX_CONNS: ${DB_MAX_CONNS:-25}
      DB_MIN_CONNS: ${DB_MIN_CONNS:-5}
      GRPC_PORT: ${GRPC_PORT:-50062}
      METRICS_PORT: ${METRICS_PORT:-9103}
      TYPST_BIN_PATH: ${TYPST_BIN_PATH:-typst}
      VERIFY_BASE_URL: ${VERIFY_BASE_URL:-https://selaras.hospital.id/verify}
    ports:
      - "${GRPC_PORT:-50062}:${GRPC_PORT:-50062}"
      - "${METRICS_PORT:-9103}:${METRICS_PORT:-9103}"

volumes:
  document-db-data:
