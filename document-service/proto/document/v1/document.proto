syntax = "proto3";

package document.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/azuvicenna/selaras-services/document-service/gen/document/v1;documentv1";

// =============================================================================
// ENUMS
// =============================================================================

enum DocumentType {
  DOCUMENT_TYPE_UNSPECIFIED = 0;

  // Dokumen Surat Medis
  DOCUMENT_TYPE_SICK_LEAVE = 1;          // Surat Keterangan Sakit
  DOCUMENT_TYPE_HEALTH_CERTIFICATE = 2;  // Surat Keterangan Sehat
  DOCUMENT_TYPE_INPATIENT_STAY = 3;      // Surat Keterangan Rawat Inap
  DOCUMENT_TYPE_REFERRAL = 4;            // Surat Rujukan
  DOCUMENT_TYPE_BIRTH_CERTIFICATE = 5;   // Surat Keterangan Lahir
  DOCUMENT_TYPE_DEATH_CERTIFICATE = 6;   // Surat Keterangan Kematian / Visum
  DOCUMENT_TYPE_INFORMED_CONSENT = 7;    // Surat Persetujuan Tindakan Medis
  DOCUMENT_TYPE_INFORMED_REFUSAL = 8;    // Surat Penolakan Tindakan Medis
  DOCUMENT_TYPE_MATERNITY_LEAVE = 9;     // Surat Cuti Hamil / Bersalin
  DOCUMENT_TYPE_DRUG_FREE = 10;          // Surat Keterangan Bebas Narkoba

  // Dokumen Penunjang Medis
  DOCUMENT_TYPE_MEDICAL_RECORD = 11;     // Berkas Rekam Medis
  DOCUMENT_TYPE_DISCHARGE_SUMMARY = 12;  // Resume Medis
  DOCUMENT_TYPE_LAB_REPORT = 13;         // Lembar Hasil Laboratorium
  DOCUMENT_TYPE_RADIOLOGY_REPORT = 14;   // Hasil Radiologi & Imaging
  DOCUMENT_TYPE_EKG_EEG_REPORT = 15;     // Laporan Hasil EKG / EEG
  DOCUMENT_TYPE_PATHOLOGY_REPORT = 16;   // Hasil Patologi Anatomi
  DOCUMENT_TYPE_PRESCRIPTION = 17;       // Lembar Resep Obat
  DOCUMENT_TYPE_NURSING_NOTE = 18;       // Catatan Observasi Klinis & Keperawatan
  DOCUMENT_TYPE_CARE_PLAN = 19;          // Rencana Perawatan (Care Plan)
  DOCUMENT_TYPE_ODONTOGRAM = 20;         // Odontogram (Rekam Medis Gigi)
}

enum DocumentStatus {
  DOCUMENT_STATUS_UNSPECIFIED = 0;
  DOCUMENT_STATUS_DRAFT = 1;
  DOCUMENT_STATUS_ISSUED = 2;
  DOCUMENT_STATUS_VOID = 3;
}

// =============================================================================
// DOMAIN MODELS
// =============================================================================

message DocumentTemplate {
  string id = 1;
  string code = 2;
  string name = 3;
  DocumentType type = 4;
  string typst_content = 5;
  bool is_active = 6;
  int32 version = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

message MedicalDocument {
  string id = 1;
  string document_number = 2;
  DocumentType type = 3;
  string title = 4;
  string encounter_id = 5;
  string patient_id = 6;
  string patient_name = 7;
  string patient_gender = 8;
  string patient_dob = 9;
  string doctor_id = 10;
  string doctor_name = 11;
  string doctor_sip = 12;
  DocumentStatus status = 13;
  string payload_json = 14;
  string typst_source = 15;
  string verification_token = 16;
  string qr_code_url = 17;
  google.protobuf.Timestamp issued_at = 18;
  google.protobuf.Timestamp valid_until = 19;
  google.protobuf.Timestamp created_at = 20;
  google.protobuf.Timestamp updated_at = 21;
}
