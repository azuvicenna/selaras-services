services:
  bff-web:
    build:
      context: ..
      dockerfile: bff-web/Dockerfile
    container_name: selaras-bff-web
    restart: on-failure
    ports:
      - "8080:8080"
      - "9090:9090"
    environment:
      HTTP_PORT: "8080"
      METRICS_PORT: "9090"
      CORS_ALLOWED_ORIGINS: "*"
      JWT_SECRET: "selaras-hospital-jwt-secret-key-32bytes!"
      AUTH_SERVICE_ADDR: "auth-service:50057"
      PATIENT_SERVICE_ADDR: "patient-service:50051"
      PRACTITIONER_SERVICE_ADDR: "practitioner-service:50056"
      ADMISSION_SERVICE_ADDR: "admission-service:50055"
      BED_SERVICE_ADDR: "bed-service:50054"
      MASTER_SERVICE_ADDR: "master-service:50053"
      EMR_SERVICE_ADDR: "emr-service:50052"
      BILLING_SERVICE_ADDR: "billing-service:50058"
      PHARMACY_SERVICE_ADDR: "pharmacy-service:50059"
      LABORATORY_SERVICE_ADDR: "laboratory-service:50060"
      RADIOLOGY_SERVICE_ADDR: "radiology-service:50061"
      DOCUMENT_SERVICE_ADDR: "document-service:50062"
    networks:
      - default

networks:
  default:
    name: selaras-network
