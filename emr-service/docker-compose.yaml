services:
  db:
    image: postgres:18-alpine
    container_name: emr-db
    environment:
      POSTGRES_USER: ${DB_USER:-emr}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me}
      POSTGRES_DB: ${DB_NAME:-emr_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - emr-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-emr} -d ${DB_NAME:-emr_db}"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: emr-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - emr-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  migration:
    image: migrate/migrate:v4.18.2
    container_name: emr-migration
    volumes:
      - ./db/migrations:/migrations
    command:
      - -path=/migrations
      - -database=postgres://${DB_USER:-emr}:${DB_PASSWORD:-change-me}@db:5432/${DB_NAME:-emr_db}?sslmode=disable
      - up
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build: .
    container_name: emr-service
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-emr}
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
      DB_NAME: ${DB_NAME:-emr_db}
      DB_MAX_CONNS: ${DB_MAX_CONNS:-25}
      DB_MIN_CONNS: ${DB_MIN_CONNS:-5}
      GRPC_PORT: ${GRPC_PORT:-50052}
      METRICS_PORT: ${METRICS_PORT:-9093}
      STORAGE_ENDPOINT: minio:9000
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-minioadmin}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-minioadmin}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-emr-documents}
      STORAGE_USE_SSL: "false"
    ports:
      - "${GRPC_PORT:-50052}:${GRPC_PORT:-50052}"
      - "${METRICS_PORT:-9093}:${METRICS_PORT:-9093}"

volumes:
  emr-db-data:
  emr-minio-data:
