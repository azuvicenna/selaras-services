version: "3.9"

services:
  notification-worker:
    build:
      context: ..
      dockerfile: notification-worker/Dockerfile
    container_name: selaras-notification-worker
    restart: on-failure
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      HTTP_PORT: "8087"
      METRICS_PORT: "9097"
      RABBITMQ_URL: amqp://selaras:selaras123@rabbitmq:5672/
      RABBITMQ_QUEUE: notification.send
      RABBITMQ_EXCHANGE: notification.exchange
      RABBITMQ_ROUTING_KEY: notification.#
      RABBITMQ_DLQ: notification.send.dlq
      WHATSAPP_PROVIDER: mock
      EMAIL_PROVIDER: mock
      WORKER_CONCURRENCY: "5"
    ports:
      - "8087:8087"
    networks:
      - selaras-network

networks:
  selaras-network:
    external: true
