syntax = "proto3";

package master.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/azuvicenna/selaras-services/master-service/gen/master/v1;masterv1";

enum DepartmentType {
  DEPARTMENT_TYPE_UNSPECIFIED = 0;
  DEPARTMENT_TYPE_OUTPATIENT = 1;
  DEPARTMENT_TYPE_INPATIENT = 2;
  DEPARTMENT_TYPE_EMERGENCY = 3;
  DEPARTMENT_TYPE_ICU = 4;
  DEPARTMENT_TYPE_PHARMACY = 5;
  DEPARTMENT_TYPE_LABORATORY = 6;
  DEPARTMENT_TYPE_RADIOLOGY = 7;
  DEPARTMENT_TYPE_OPERATING_ROOM = 8;
  DEPARTMENT_TYPE_REHABILITATION = 9;
  DEPARTMENT_TYPE_ADMINISTRATION = 10;
}

message Department {
  string id = 1;
  string code = 2;
  string name = 3;
  DepartmentType department_type = 4;
  bool is_active = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
}
