syntax = "proto3";

package patient.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/azuvicenna/selaras-services/patient-service/gen/patient/v1;patientv1";

// -----------------------------------------------------------------------------
// ENUMS
// -----------------------------------------------------------------------------

enum Gender {
  GENDER_UNSPECIFIED = 0;
  GENDER_MALE = 1;                // Laki-laki
  GENDER_FEMALE = 2;              // Perempuan
}

enum BloodType {
  BLOOD_TYPE_UNSPECIFIED = 0;
  BLOOD_TYPE_A = 1;               // A
  BLOOD_TYPE_B = 2;               // B
  BLOOD_TYPE_AB = 3;              // AB
  BLOOD_TYPE_O = 4;               // O
}

enum MaritalStatus {
  MARITAL_STATUS_UNSPECIFIED = 0;
  MARITAL_STATUS_SINGLE = 1;       // Belum Menikah
  MARITAL_STATUS_MARRIED = 2;      // Menikah
  MARITAL_STATUS_DIVORCED = 3;     // Cerai Hidup
  MARITAL_STATUS_WIDOWED = 4;      // Cerai Mati / Janda / Duda
}

enum Religion {
  RELIGION_UNSPECIFIED = 0;
  RELIGION_ISLAM = 1;              // Islam
  RELIGION_PROTESTANT = 2;         // Kristen / Protestan
  RELIGION_CATHOLIC = 3;           // Katolik
  RELIGION_HINDU = 4;              // Hindu
  RELIGION_BUDDHIST = 5;           // Buddha
  RELIGION_CONFUCIAN = 6;          // Khonghucu
  RELIGION_OTHER = 7;              // Kepercayaan Lainnya
}

enum DisabilityType {
  DISABILITY_TYPE_UNSPECIFIED = 0;
  DISABILITY_TYPE_NONE = 1;            // Tidak ada disabilitas
  DISABILITY_TYPE_HEARING = 2;         // Tunarungu (Gangguan Pendengaran)
  DISABILITY_TYPE_VISUAL = 3;          // Tunanetra (Gangguan Penglihatan)
  DISABILITY_TYPE_SPEECH = 4;          // Tunawicara (Gangguan Bicara)
  DISABILITY_TYPE_PHYSICAL = 5;        // Tunadaksa (Pengguna Kursi Roda / Alat Bantu)
  DISABILITY_TYPE_MENTAL = 6;          // Tunagrahita / Gangguan Mental/Intelektual
  DISABILITY_TYPE_COLOR_BLINDNESS = 7; // Buta Warna (Parsial / Total)
  DISABILITY_TYPE_OTHER = 8;           // Lainnya
}

enum PatientStatus {
  PATIENT_STATUS_UNSPECIFIED = 0;
  PATIENT_STATUS_ACTIVE = 1;       // Aktif
  PATIENT_STATUS_INACTIVE = 2;     // Tidak Aktif
  PATIENT_STATUS_DECEASED = 3;     // Meninggal
}

// -----------------------------------------------------------------------------
// DOMAIN MODEL
// -----------------------------------------------------------------------------

message Patient {
  // Identitas Utama & SATUSEHAT
  string id = 1;
  string medical_record_no = 2;               // Nomor Rekam Medis (NORM)
  string satusehat_id = 3;                    // IHS ID SATUSEHAT Kemenkes
  string nik = 4;                             // Nomor Induk Kependudukan (NIK)
  string name = 5;                            // Nama Lengkap Pasien
  string mother_name = 6;                     // Nama Ibu Kandung (Wajib Dukcapil/SATUSEHAT)
  
  // Demografi & Status
  string birth_place = 7;                     // Tempat Lahir
  google.protobuf.Timestamp birth_date = 8;   // Tanggal Lahir
  Gender gender = 9;                          // Jenis Kelamin (Enum)
  BloodType blood_type = 10;                  // Golongan Darah (Enum)
  MaritalStatus marital_status = 11;          // Status Pernikahan (Enum)
  Religion religion = 12;                     // Agama (Enum)
  
  // Kontak & Alamat
  string phone = 13;                          // Nomor Telepon / WA
  string email = 14;                          // Email Pasien (Opsional)
  string address = 15;                        // Alamat Lengkap (Nama Jalan / Rumah)
  string village_code = 16;                   // Kode Kelurahan/Desa
  string district_code = 17;                  // Kode Kecamatan
  string city_code = 18;                      // Kode Kab/Kota
  string province_code = 19;                  // Kode Provinsi
  string postal_code = 20;                    // Kode Pos
  string rt = 21;                             // Nomor RT
  string rw = 22;                             // Nomor RW
  
  // Profil Sosial & Komunikasi
  string occupation = 23;                     // Pekerjaan (PNS, Swasta, TNI, dll)
  string education = 24;                      // Pendidikan Terakhir (SD, SMA, S1, dll)
  string preferred_language = 25;             // Bahasa Komunikasi Pasien (e.g., "Indonesia", "Sunda")

  // Kebutuhan Khusus & Pelayanan Pelanggan
  DisabilityType disability_type = 26;        // Jenis Disabilitas (Enum)
  string special_needs_note = 27;             // Catatan Kebutuhan Khusus (e.g., "Butuh kursi roda", "Pendamping bahasa isyarat")

  // Foto & Biometrik Dasar
  string photo_url = 28;                      // URL / Storage Path Foto Pasien
  bytes fingerprint_template = 29;            // Hash / Template Sidik Jari (opsional untuk verifikasi cepat)
  
  // Status Operasional & Audit Trail
  PatientStatus status = 30;                  // Status Aktif Pasien (Enum)
  google.protobuf.Timestamp created_at = 31;
  google.protobuf.Timestamp updated_at = 32;
}

