syntax = "proto3";

package patient.v1;

import "patient/v1/patient.proto";
import "patient/v1/document.proto";
import "patient/v1/family.proto";
import "patient/v1/emergency_contact.proto";
import "patient/v1/insurance.proto";

option go_package = "github.com/azuvicenna/selaras-services/patient-service/gen/patient/v1;patientv1";

// =============================================================================
// SERVICE DEFINITION
// =============================================================================

service PatientService {
  // --- 1. PATIENT CORE ---
  rpc CreatePatient (CreatePatientRequest) returns (CreatePatientResponse);
  rpc GetPatientByID (GetPatientByIDRequest) returns (GetPatientByIDResponse);
  rpc GetPatientByNIK (GetPatientByNIKRequest) returns (GetPatientByNIKResponse);
  rpc GetPatientByMedicalRecordNo (GetPatientByMedicalRecordNoRequest) returns (GetPatientByMedicalRecordNoResponse);
  rpc ListPatients (ListPatientsRequest) returns (ListPatientsResponse);
  rpc UpdatePatient (UpdatePatientRequest) returns (UpdatePatientResponse);
  rpc UpdatePatientStatus (UpdatePatientStatusRequest) returns (UpdatePatientStatusResponse);
  rpc VerifyPatientBiometric (VerifyPatientBiometricRequest) returns (VerifyPatientBiometricResponse);

  // --- 2. DOCUMENT ---
  rpc UploadPatientDocument (UploadPatientDocumentRequest) returns (UploadPatientDocumentResponse);
  rpc GetPatientDocuments (GetPatientDocumentsRequest) returns (GetPatientDocumentsResponse);
  rpc GetPatientDocumentByID (GetPatientDocumentByIDRequest) returns (GetPatientDocumentByIDResponse);
  rpc DeletePatientDocument (DeletePatientDocumentRequest) returns (DeletePatientDocumentResponse);

  // --- 3. FAMILY ---
  rpc AddPatientFamily (AddPatientFamilyRequest) returns (AddPatientFamilyResponse);
  rpc GetPatientFamilies (GetPatientFamiliesRequest) returns (GetPatientFamiliesResponse);
  rpc UpdatePatientFamily (UpdatePatientFamilyRequest) returns (UpdatePatientFamilyResponse);
  rpc DeletePatientFamily (DeletePatientFamilyRequest) returns (DeletePatientFamilyResponse);

  // --- 4. EMERGENCY CONTACT ---
  rpc AddEmergencyContact (AddEmergencyContactRequest) returns (AddEmergencyContactResponse);
  rpc GetEmergencyContacts (GetEmergencyContactsRequest) returns (GetEmergencyContactsResponse);
  rpc UpdateEmergencyContact (UpdateEmergencyContactRequest) returns (UpdateEmergencyContactResponse);
  rpc DeleteEmergencyContact (DeleteEmergencyContactRequest) returns (DeleteEmergencyContactResponse);

  // --- 5. INSURANCE ---
  rpc AddPatientInsurance (AddPatientInsuranceRequest) returns (AddPatientInsuranceResponse);
  rpc GetPatientInsurances (GetPatientInsurancesRequest) returns (GetPatientInsurancesResponse);
  rpc UpdatePatientInsurance (UpdatePatientInsuranceRequest) returns (UpdatePatientInsuranceResponse);
  rpc ToggleInsuranceStatus (ToggleInsuranceStatusRequest) returns (ToggleInsuranceStatusResponse);
  rpc DeletePatientInsurance (DeletePatientInsuranceRequest) returns (DeletePatientInsuranceResponse);
}

// =============================================================================
// REQUEST & RESPONSE MESSAGES
// =============================================================================

// -----------------------------------------------------------------------------
// 1. PATIENT CORE MESSAGES
// -----------------------------------------------------------------------------

message CreatePatientRequest {
  Patient patient = 1;
}

message CreatePatientResponse {
  Patient patient = 1;
}

message GetPatientByIDRequest {
  string id = 1;
}

message GetPatientByIDResponse {
  Patient patient = 1;
}

message GetPatientByNIKRequest {
  string nik = 1;
}

message GetPatientByNIKResponse {
  Patient patient = 1;
}

message GetPatientByMedicalRecordNoRequest {
  string medical_record_no = 1;
}

message GetPatientByMedicalRecordNoResponse {
  Patient patient = 1;
}

message ListPatientsRequest {
  string name = 1;
  PatientStatus status = 2;
  int32 limit = 3;
  int32 offset = 4;
}

message ListPatientsResponse {
  repeated Patient patients = 1;
  int64 total_count = 2;
}

message UpdatePatientRequest {
  Patient patient = 1;
}

message UpdatePatientResponse {
  Patient patient = 1;
}

message UpdatePatientStatusRequest {
  string id = 1;
  PatientStatus status = 2;
}

message UpdatePatientStatusResponse {
  bool success = 1;
}

message VerifyPatientBiometricRequest {
  string patient_id = 1;
  bytes fingerprint_data = 2;
}

message VerifyPatientBiometricResponse {
  bool is_matched = 1;
  string message = 2;
}

// -----------------------------------------------------------------------------
// 2. DOCUMENT MESSAGES
// -----------------------------------------------------------------------------

message UploadPatientDocumentRequest {
  PatientDocument document = 1;
  bytes file_content = 2;
  string file_name = 3;
  string content_type = 4;
}

message UploadPatientDocumentResponse {
  PatientDocument document = 1;
}

message GetPatientDocumentsRequest {
  string patient_id = 1;
}

message GetPatientDocumentsResponse {
  repeated PatientDocument documents = 1;
}

message GetPatientDocumentByIDRequest {
  string id = 1;
}

message GetPatientDocumentByIDResponse {
  PatientDocument document = 1;
}

message DeletePatientDocumentRequest {
  string id = 1;
}

message DeletePatientDocumentResponse {
  bool success = 1;
}

// -----------------------------------------------------------------------------
// 3. FAMILY MESSAGES
// -----------------------------------------------------------------------------

message AddPatientFamilyRequest {
  PatientFamily family = 1;
}

message AddPatientFamilyResponse {
  PatientFamily family = 1;
}

message GetPatientFamiliesRequest {
  string patient_id = 1;
}

message GetPatientFamiliesResponse {
  repeated PatientFamily families = 1;
}

message UpdatePatientFamilyRequest {
  PatientFamily family = 1;
}

message UpdatePatientFamilyResponse {
  PatientFamily family = 1;
}

message DeletePatientFamilyRequest {
  string id = 1;
}

message DeletePatientFamilyResponse {
  bool success = 1;
}

// -----------------------------------------------------------------------------
// 4. EMERGENCY CONTACT MESSAGES
// -----------------------------------------------------------------------------

message AddEmergencyContactRequest {
  PatientEmergencyContact contact = 1;
}

message AddEmergencyContactResponse {
  PatientEmergencyContact contact = 1;
}

message GetEmergencyContactsRequest {
  string patient_id = 1;
}

message GetEmergencyContactsResponse {
  repeated PatientEmergencyContact contacts = 1;
}

message UpdateEmergencyContactRequest {
  PatientEmergencyContact contact = 1;
}

message UpdateEmergencyContactResponse {
  PatientEmergencyContact contact = 1;
}

message DeleteEmergencyContactRequest {
  string id = 1;
}

message DeleteEmergencyContactResponse {
  bool success = 1;
}

// -----------------------------------------------------------------------------
// 5. INSURANCE MESSAGES
// -----------------------------------------------------------------------------

message AddPatientInsuranceRequest {
  PatientInsurance insurance = 1;
}

message AddPatientInsuranceResponse {
  PatientInsurance insurance = 1;
}

message GetPatientInsurancesRequest {
  string patient_id = 1;
}

message GetPatientInsurancesResponse {
  repeated PatientInsurance insurances = 1;
}

message UpdatePatientInsuranceRequest {
  PatientInsurance insurance = 1;
}

message UpdatePatientInsuranceResponse {
  PatientInsurance insurance = 1;
}

message ToggleInsuranceStatusRequest {
  string id = 1;
  bool is_active = 2;
}

message ToggleInsuranceStatusResponse {
  bool success = 1;
}

message DeletePatientInsuranceRequest {
  string id = 1;
}

message DeletePatientInsuranceResponse {
  bool success = 1;
}