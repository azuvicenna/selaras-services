version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: gomod
    directories:
      - "/*-service"
      - "/bff-*"
      - "/b2b-gateway"
      - "/*-worker"
      - "/scripts/migrator"
      - "/tests/e2e"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      go-deps:
        patterns: ["*"]
